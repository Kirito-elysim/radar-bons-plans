api_platform:
    title: Radar Bons Plans
    description: 'API des bons plans courses : catalogues, remboursements, bons, codes promo, Shopmium et TikTok.'
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    patch_formats:
        json: ['application/merge-patch+json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
    defaults:
        stateless: true
        # Les champs nuls sont renvoyés explicitement (contrat stable pour le front TypeScript).
        normalization_context:
            skip_null_values: false
        pagination_items_per_page: 30
        pagination_client_items_per_page: true
        pagination_maximum_items_per_page: 100
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
