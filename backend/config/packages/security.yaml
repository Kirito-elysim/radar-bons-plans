security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        utilisateurs:
            # Chargement via UserRepository::loadUserByIdentifier() (e-mail insensible à la casse)
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        # Connexion : POST /api/connexion {"email": "...", "motDePasse": "..."} → {"token": "..."}
        connexion:
            pattern: ^/api/connexion$
            stateless: true
            provider: utilisateurs
            json_login:
                check_path: /api/connexion
                username_path: email
                password_path: motDePasse
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # 5 tentatives par minute et par adresse e-mail + IP
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

        api:
            pattern: ^/api
            stateless: true
            provider: utilisateurs
            jwt: ~

    access_control:
        - { path: ^/api/connexion$, roles: PUBLIC_ACCESS }
        - { path: ^/api/inscription$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hachage rapide en test (les valeurs par défaut sont volontairement lentes)
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
