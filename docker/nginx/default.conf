# Radar Bons Plans : PWA statique + API Symfony (php-fpm). TLS terminé par le proxy de Coolify (Traefik).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 2m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json application/ld+json application/manifest+json image/svg+xml text/csv;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API Symfony
    location /api {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
        fastcgi_read_timeout 150s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Type MIME du manifeste PWA (absent de la table par défaut de nginx)
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Icônes : cache d'une semaine
    location /icones/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Service worker : toujours revalidé pour que les mises à jour arrivent
    location ~ ^/(sw\.js|sw-push\.js|workbox-.*\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Fichiers versionnés par Vite : cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Application monopage : toute autre URL renvoie index.html
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS signalé par le proxy de Coolify (X-Forwarded-Proto)
map $http_x_forwarded_proto $fastcgi_https {
    default "";
    https on;
}
