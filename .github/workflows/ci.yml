name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHPUnit, PHPStan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: radar_test
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # La suite de tests ajoute « _test » au nom de la base : radar → radar_test
      DATABASE_URL: postgresql://radar:radar@127.0.0.1:5432/radar?serverVersion=16&charset=utf8
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_pgsql, bcmath, gmp, apcu
          ini-values: date.timezone=Europe/Paris, memory_limit=1G
          coverage: none
          tools: composer:v2
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Clés JWT de test
        run: php bin/console lexik:jwt:generate-keypair --env=test --skip-if-exists
      - name: Migrations (base de test)
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
      - run: vendor/bin/phpunit
      - name: PHPStan (niveau 8)
        run: |
          php bin/console cache:warmup --env=dev
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  frontend:
    name: Frontend (ESLint, Prettier, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  images:
    name: Images Docker de production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image PHP
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: false
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php
      - name: Image nginx + PWA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: false
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
